<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Kontrola baterie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #fff; font-family: Roboto, system-ui, sans-serif; overflow: hidden; user-select: none; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .screen.on { display: flex; }

  /* 1) nevinný start */
  #start { background: #101418; }
  #start .icon { font-size: 72px; margin-bottom: 20px; }
  #start h1 { font-size: 22px; font-weight: 500; margin-bottom: 8px; }
  #start p { color: #9aa4ad; font-size: 15px; margin-bottom: 32px; }
  .btn { background: #2f7df6; color: #fff; border: 0; border-radius: 24px; padding: 14px 36px; font-size: 16px; font-weight: 500; }

  /* 2) falešná kontrola */
  #scan { background: #101418; }
  .bar { width: 80%; max-width: 360px; height: 8px; background: #2a3138; border-radius: 4px; overflow: hidden; margin: 24px 0 12px; }
  .fill { height: 100%; width: 0; background: #34c759; transition: background .3s; }
  #scanText { color: #9aa4ad; font-size: 14px; min-height: 20px; }
  #pct { font-size: 48px; font-weight: 300; }
  #temp { margin-top: 18px; font-size: 15px; color: #9aa4ad; }

  /* 3) poplach */
  #alarm { background: #300; animation: blink .35s steps(1) infinite; }
  @keyframes blink { 50% { background: #c00; } }
  #alarm h2 { font-size: 26px; font-weight: 900; letter-spacing: 1px; margin-bottom: 10px; }
  #alarm p { font-size: 16px; margin-bottom: 20px; }
  #count { font-size: 140px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px #ff0; }
  .shake { animation: shake .08s infinite; }
  @keyframes shake { 0%{transform:translate(0,0)} 25%{transform:translate(6px,-4px)} 50%{transform:translate(-5px,5px)} 75%{transform:translate(4px,3px)} }

  /* 4) výbuch */
  #boom { background: #000; padding: 0; }
  #boom canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #crack { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .1s; pointer-events: none; }

  /* 5) odhalení */
  #reveal { background: linear-gradient(160deg, #ffde59, #ff7aa2); color: #222; }
  #reveal .icon { font-size: 96px; animation: bounce 1s infinite; }
  @keyframes bounce { 50% { transform: translateY(-14px) rotate(-8deg); } }
  #reveal h1 { font-size: 34px; font-weight: 900; margin: 16px 0 8px; }
  #reveal p { font-size: 17px; margin-bottom: 28px; }
  #reveal .btn { background: #222; }
</style>
</head>
<body>

<div id="start" class="screen on">
  <div class="icon">🔋</div>
  <h1>Kontrola stavu baterie</h1>
  <p>Zjistěte, jak je na tom vaše baterie.<br>Test trvá asi 10 sekund.</p>
  <button class="btn" id="go">Spustit test</button>
</div>

<div id="scan" class="screen">
  <div id="pct">0 %</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="scanText">Inicializace…</div>
  <div id="temp">Teplota: 31 °C</div>
</div>

<div id="alarm" class="screen">
  <h2>⚠️ KRITICKÉ PŘEHŘÁTÍ ⚠️</h2>
  <p>Teplota baterie: <b id="alarmTemp">97</b> °C<br>Okamžitě odložte zařízení!</p>
  <div id="count">5</div>
</div>

<div id="boom" class="screen">
  <canvas id="cv"></canvas>
  <svg id="crack" viewBox="0 0 100 180" preserveAspectRatio="none">
    <g stroke="#fff" stroke-width=".4" fill="none" opacity=".85">
      <path d="M58 70 L40 30 L35 0 M58 70 L80 40 L100 35 M58 70 L95 90 M58 70 L75 130 L70 180 M58 70 L30 110 L0 120 M58 70 L20 70 L0 60 M58 70 L50 140 L40 180"/>
      <path d="M48 50 L62 48 L72 58 M70 85 L60 95 L45 88 M40 30 L28 34 M80 40 L86 22 M75 130 L90 140 M30 110 L22 140" stroke-width=".25"/>
      <circle cx="58" cy="70" r="4" stroke-width=".3"/>
      <circle cx="58" cy="70" r="9" stroke-width=".2"/>
    </g>
  </svg>
  <div id="flash"></div>
</div>

<div id="reveal" class="screen">
  <div class="icon">😜</div>
  <h1>NACHYTÁN!</h1>
  <p>Klid, telefon je úplně v pořádku.<br>Nic nevybouchlo… tentokrát. 😄</p>
  <button class="btn" id="again">Ještě jednou</button>
</div>

<script>
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); };
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const wait = ms => new Promise(r => setTimeout(r, ms));
let ac;

function beep(freq, dur, type = 'square', vol = .25) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}

function explosion() {
  const len = ac.sampleRate * 2.5, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
  const src = ac.createBufferSource(); src.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(3000, ac.currentTime);
  lp.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 2);
  const g = ac.createGain(); g.gain.value = 1.6;
  src.connect(lp).connect(g).connect(ac.destination); src.start();
  // hluboký úder
  const o = ac.createOscillator(), og = ac.createGain();
  o.frequency.setValueAtTime(120, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(30, ac.currentTime + .8);
  og.gain.setValueAtTime(1, ac.currentTime);
  og.gain.exponentialRampToValueAtTime(.001, ac.currentTime + 1);
  o.connect(og).connect(ac.destination); o.start(); o.stop(ac.currentTime + 1);
}

function particles() {
  const cv = $('cv'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cx = W * .58, cy = H * .39;
  const ps = Array.from({ length: 260 }, () => {
    const a = Math.random() * Math.PI * 2, s = (Math.random() * 18 + 4) * devicePixelRatio;
    return { x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 6 + 2, life: 1, hue: 20 + Math.random() * 40 };
  });
  let t = 0;
  (function frame() {
    t++;
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, W, H);
    if (t < 25) { // ohnivá koule
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, t * 30 * devicePixelRatio);
      g.addColorStop(0, 'rgba(255,255,200,.9)'); g.addColorStop(.4, 'rgba(255,140,0,.6)'); g.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .25; p.vx *= .97; p.vy *= .97; p.life -= .012;
      if (p.life > 0) { ctx.fillStyle = `hsla(${p.hue},100%,${50 + p.life * 30}%,${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * devicePixelRatio, 0, 7); ctx.fill(); }
    });
    if (t < 140) requestAnimationFrame(frame);
  })();
}

async function run() {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}

  // falešný test
  show('scan');
  const msgs = ['Čtení článků baterie…', 'Měření napětí…', 'Kontrola nabíjecích cyklů…', 'Analýza teploty…', 'Hmm… to není dobré…'];
  let temp = 31;
  for (let p = 0; p <= 78; p++) {
    $('pct').textContent = p + ' %';
    $('fill').style.width = p + '%';
    $('scanText').textContent = msgs[Math.min(msgs.length - 1, Math.floor(p / 16))];
    if (p > 50) { temp += Math.random() * 3 + 1; $('fill').style.background = p > 65 ? '#ff3b30' : '#ff9500'; }
    $('temp').textContent = 'Teplota: ' + Math.round(temp) + ' °C';
    $('temp').style.color = temp > 60 ? '#ff3b30' : '#9aa4ad';
    await wait(p > 60 ? 160 : 90);
  }
  await wait(600);

  // poplach + odpočet
  show('alarm');
  document.body.classList.add('shake');
  for (let n = 5; n >= 1; n--) {
    $('count').textContent = n;
    $('alarmTemp').textContent = Math.round(97 + (5 - n) * 9);
    beep(880, .25); setTimeout(() => beep(660, .25), 300);
    vib([200, 100, 200]);
    await wait(1000);
  }

  // BUM
  document.body.classList.remove('shake');
  show('boom');
  explosion(); particles();
  vib([800, 100, 400, 100, 200]);
  $('flash').style.opacity = 1;
  setTimeout(() => { $('flash').style.transition = 'opacity 1.2s'; $('flash').style.opacity = 0; }, 80);
  setTimeout(() => $('crack').style.opacity = 1, 300);
  document.body.classList.add('shake');
  await wait(900);
  document.body.classList.remove('shake');
  await wait(2600);

  // odhalení
  beep(523, .15, 'sine', .3); setTimeout(() => beep(659, .15, 'sine', .3), 150); setTimeout(() => beep(784, .3, 'sine', .3), 300);
  show('reveal');
}

$('go').onclick = run;
$('again').onclick = () => {
  $('crack').style.opacity = 0; $('flash').style.transition = ''; $('fill').style.width = 0; $('fill').style.background = '#34c759';
  run();
};
</script>
</body>
</html>
