<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101418">
<title>🎰 100 free spinů zdarma!</title>
<meta name="description" content="Kachní Kasino: vyzvedni si bonus 100 free spinů bez vkladu 🎁">
<meta property="og:title" content="🎰 100 free spinů zdarma!">
<meta property="og:description" content="Kachní Kasino: vyzvedni si bonus 100 free spinů bez vkladu 🎁">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #fff; font-family: Roboto, system-ui, sans-serif; overflow: hidden; user-select: none; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* 1) návnada – smyšlené kasino */
  #start { background: radial-gradient(circle at 50% 30%, #4b1d7a, #160628 70%); flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #start .brand { font-size: 15px; font-weight: 800; letter-spacing: 3px; color: #ffd84d; margin-bottom: 22px; }
  #start .icon { font-size: 84px; margin-bottom: 10px; animation: spinb 1.6s ease-in-out infinite; }
  @keyframes spinb { 50% { transform: scale(1.12) rotate(-6deg); } }
  #start h1 { font-size: clamp(38px, 13vw, 64px); font-weight: 900; line-height: 1; color: #ffd84d; text-shadow: 0 0 18px #ffb300, 0 3px 0 #b36b00; }
  #start h2 { font-size: 20px; font-weight: 800; margin: 6px 0 14px; letter-spacing: 1px; }
  #start p { color: #d9c7f0; font-size: 15px; margin-bottom: 28px; }
  #start .timer { color: #ff6b6b; font-weight: 700; }
  .btn { background: #2f7df6; color: #fff; border: 0; border-radius: 24px; padding: 14px 36px; font-size: 16px; font-weight: 500; }
  #go { background: linear-gradient(180deg, #ffe066, #ffab00); color: #3a1500; font-weight: 900; font-size: 18px; padding: 16px 40px; border-radius: 30px;
        box-shadow: 0 0 24px rgba(255,200,0,.6); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  /* 2) blikání */
  #flicker { background: #fff; }

  /* 3) hack */
  #hack { background: #000; font-family: "Courier New", ui-monospace, monospace; color: #33ff66; }
  #matrix { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; }
  #term { position: relative; z-index: 1; padding: 16px; font-size: clamp(12px, 3.6vw, 16px); line-height: 1.45; width: 100%; align-self: flex-start;
          overflow: hidden; text-shadow: 0 0 6px #33ff66; white-space: pre-wrap; word-break: break-word; }
  #term .red { color: #ff4444; text-shadow: 0 0 6px #ff4444; }
  #term .yel { color: #ffdd33; text-shadow: 0 0 6px #ffdd33; }
  #term .big { font-size: 1.5em; font-weight: bold; }
  .cursor { display: inline-block; width: .6em; height: 1em; background: #33ff66; vertical-align: -2px; animation: cur .6s steps(1) infinite; }
  @keyframes cur { 50% { opacity: 0; } }
  #skull { position: absolute; z-index: 2; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
           background: rgba(0,0,0,.85); text-align: center; color: #ff4444; text-shadow: 0 0 12px #ff0000; }
  #skull.on { display: flex; animation: redblink .3s steps(1) infinite; }
  @keyframes redblink { 50% { background: rgba(80,0,0,.9); } }
  #skull .s { font-size: 110px; }
  #skull h2 { font-family: "Courier New", monospace; font-size: clamp(20px, 7vw, 34px); margin-top: 10px; }

  .glitch { animation: glitch .1s steps(2) infinite; }
  @keyframes glitch {
    0% { transform: translate(0,0); filter: none; }
    25% { transform: translate(-8px,3px) skewX(8deg); filter: hue-rotate(90deg) saturate(4); }
    50% { transform: translate(6px,-4px); filter: invert(1); }
    75% { transform: translate(-3px,6px) skewY(-5deg); filter: hue-rotate(220deg); }
  }

  /* 4) pointa */
  #reveal { background: #000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #reveal h1 { font-size: clamp(48px, 17vw, 120px); font-weight: 900; line-height: .95; text-transform: uppercase;
               background: linear-gradient(90deg, #ff3b30, #ffcc00, #34c759, #2f7df6, #af52de, #ff3b30); background-size: 300% 100%;
               -webkit-background-clip: text; background-clip: text; color: transparent; animation: rainbow 2s linear infinite, pop .6s cubic-bezier(.2,2,.4,1); }
  @keyframes rainbow { to { background-position: 300% 0; } }
  @keyframes pop { from { transform: scale(0) rotate(-20deg); } }
  #reveal .emoji { font-size: 80px; margin-top: 20px; animation: wobble .8s ease-in-out infinite; }
  @keyframes wobble { 50% { transform: rotate(15deg) scale(1.15); } }
  #reveal p { margin-top: 18px; color: #aaa; font-size: 15px; }
  #reveal .btn { margin-top: 30px; background: #333; }
</style>
</head>
<body>

<div id="start" class="screen on">
  <div class="brand">🦆 KACHNÍ KASINO</div>
  <div class="icon">🎰</div>
  <h1>100 FREE<br>SPINŮ</h1>
  <h2>ZDARMA · BEZ VKLADU</h2>
  <p>Bonus pro tebe vyprší za <span class="timer" id="tm">04:59</span></p>
  <button class="btn" id="go">VYZVEDNOUT BONUS</button>
</div>

<div id="flicker" class="screen"></div>

<div id="hack" class="screen">
  <canvas id="matrix"></canvas>
  <div id="term"></div>
  <div id="skull"><div class="s">💀</div><h2>SYSTÉM OVLÁDNUT</h2></div>
</div>

<div id="reveal" class="screen">
  <h1>Adam<br>je<br>vocas</h1>
  <div class="emoji">🤪</div>
  <p>Klid, nic se nestalo. Byl to jen vtip 😄</p>
  <button class="btn" id="again">Ještě jednou</button>
</div>

<script>
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); };
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const wait = ms => new Promise(r => setTimeout(r, ms));
let ac, matrixOn = false;

function tone(freq, dur, type = 'square', vol = .15, when = 0) {
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur = .3, vol = .4) {
  const len = ac.sampleRate * dur, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (i % 300 < 150 ? 1 : .2);
  const s = ac.createBufferSource(), g = ac.createGain(); g.gain.value = vol;
  s.buffer = buf; s.connect(g).connect(ac.destination); s.start();
}
const click = () => tone(1800 + Math.random() * 800, .02, 'square', .04);

function matrix() {
  const cv = $('matrix'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight, fs = 16, cols = Math.ceil(W / fs);
  const drops = Array(cols).fill(0).map(() => Math.random() * -50);
  const chars = 'アイウエオカキクケコ01ADAMVOCAS<>/{}#$%&';
  matrixOn = true;
  (function f() {
    if (!matrixOn) return;
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#33ff66'; ctx.font = fs + 'px monospace';
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.random() * chars.length | 0], i * fs, y * fs);
      drops[i] = y * fs > H && Math.random() > .975 ? 0 : y + 1;
    });
    requestAnimationFrame(f);
  })();
}

const term = () => $('term');
function trimTerm() { while (term().offsetHeight > innerHeight - 20 && term().firstChild) term().removeChild(term().firstChild); }

async function type(text, cls = '', speed = 18) {
  const line = document.createElement('div'); if (cls) line.className = cls;
  const cur = document.createElement('span'); cur.className = 'cursor';
  term().appendChild(line); line.appendChild(cur);
  for (const ch of text) { cur.before(ch); if (ch !== ' ') click(); await wait(speed); }
  cur.remove(); trimTerm();
}
async function bar(label, ms = 1400, cls = '') {
  const line = document.createElement('div'); if (cls) line.className = cls;
  term().appendChild(line);
  for (let p = 0; p <= 100; p += 5) {
    const n = p / 5 | 0;
    line.textContent = `${label} [${'█'.repeat(n)}${'░'.repeat(20 - n)}] ${p}%`;
    if (p % 20 === 0) tone(400 + p * 6, .05, 'square', .06);
    await wait(ms / 20);
  }
  trimTerm();
}

async function run() {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
  term().innerHTML = ''; $('skull').classList.remove('on');

  // blikání
  for (let i = 0; i < 9; i++) {
    show(i % 2 ? 'start' : 'flicker');
    $('flicker').style.background = ['#fff', '#000', '#0f0', '#f00'][i % 4];
    noise(.05, .3); vib(40);
    await wait(60 + Math.random() * 90);
  }
  document.body.classList.add('glitch'); noise(.4, .5); vib([200, 60, 200]);
  await wait(400);
  document.body.classList.remove('glitch');

  // hack
  show('hack'); matrix();
  await type('> Navazuji spojení…', '', 30);
  await type('> Připojeno k zařízení: ADAMŮV TELEFON', '', 22);
  await type('> ███ ELITNÍ HACKEŘI Z HORNÍ DOLNÍ ███', 'red big', 35);
  await wait(400);
  await bar('Prolamuji heslo', 1500);
  await type('  Heslo nalezeno: "heslo123" (fakt, Adame?)', 'yel');
  await bar('Stahuji galerii ', 1600);
  await type('  Nalezeno 4 382 fotek koček 🐈 a 1 selfie s kachnou');
  await bar('Čtu historii hledání', 1300);
  await type('  "jak vypadat cool" (hledáno 57×)');
  await type('  "proč mi nikdo neodpovídá na zprávy"');
  await type('  "je normální jíst rohlík ve sprše"');
  await bar('Analyzuji osobnost', 1200);
  await type('  Výsledek: 3 % cool, 97 % vocas', 'yel');
  await type('  Tajný talent: prohrávat v Člověče, nezlob se');
  await bar('Odesílám vše babičce na Facebook', 2200, 'red');
  await wait(300);

  // lebka
  $('skull').classList.add('on');
  [220, 180, 140].forEach((f, i) => tone(f, .35, 'sawtooth', .2, i * .35));
  vib([300, 100, 300, 100, 600]);
  await wait(2200);

  // pointa
  document.body.classList.add('glitch'); noise(.6, .5);
  await wait(600);
  document.body.classList.remove('glitch');
  matrixOn = false;
  show('reveal');
  [392, 392, 392, 311].forEach((f, i) => tone(f, i === 3 ? .8 : .18, 'sawtooth', .18, i * .2));
  [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'square', .12, 1.3 + i * .12));
  vib([100, 100, 100, 100, 600]);
}

$('go').onclick = run;
let left = 299; setInterval(() => { if (left > 0) left--; $('tm').textContent = String(left / 60 | 0).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); }, 1000);
$('again').onclick = run;
</script>
</body>
</html>
